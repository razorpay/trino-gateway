service: trino-gateway  # required, canonical slug — immutable once registered
displayName: "Trino Gateway"  # human-readable name — README title "Trino-Gateway" rendered without the hyphen per Title Case conventions
description: "Load balancer / routing proxy for Razorpay's Trino query-engine clusters — a stateless Go (twirp) gateway that health-checks Trino clusters, routes queries across them and synchronizes routing state through a relational database."  # README: "Trino-Gateway is a load balancer / routing proxy / gateway primarily for Trino Query engine, written in Go and uses twirp framework... Horizontally scalable - each instance is stateless, and a relational database is used for synchronization. Cluster Monitoring - Periodic Trino Cluster healthchecks"; tree: cmd/, internal/, pkg/, rpc/, build/docker/prod/Dockerfile.razorpay
type: service  # a Go HTTP/twirp server (cmd/, rpc/, prod Dockerfile including a Dockerfile.razorpay) — a deployed routing proxy; no Spinnaker/Netra record in the harvest, but the deploy artifacts are in-repo
tier: T2  # sits in front of the data org's Trino clusters — its outage degrades analytics/query access for internal users (above T3 tooling), but it is not merchant-facing and queries can be pointed at clusters directly in a pinch
lifecycle: live  # mature repo (499 files, risk-assessment skill present, prod Dockerfile) actively maintained — pushed 2026-08-03; the absence of a Spinnaker record suggests a non-Spinnaker deploy path, consistent with data-platform infra

domain: data-platform/data-engineering  # l1 family data-platform from miss_seed (BU Data Org, team Platform Engineering); area data-engineering — Trino gateway is query-platform infrastructure, matching the data-platform patches already filed under data-engineering

